[project]
name = "slurptuna"
dynamic = ["version"]
description = "Simple objective optimization orchestration for Slurm clusters"
readme = "README.md"
authors = [
    { name = "younesStrittmatter", email = "ystrittm@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "optuna>=3.6.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
slurptuna = "slurptuna.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.version]
source = "vcs"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
