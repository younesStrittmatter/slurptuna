site_name: slurptuna
site_description: Optuna hyperparameter optimization on Slurm, without the boilerplate.
repo_url: https://github.com/younesStrittmatter/slurptuna

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: cyan
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Distributed Mode: distributed.md
  - Participant-wise Fitting: participant-wise.md
  - Examples: examples.md
  - API Reference: api.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - pymdownx.details

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            docstring_style: google
